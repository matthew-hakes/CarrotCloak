# Builds CarrotCloak.zip (containing a folder named exactly "CarrotCloak")
# and attaches it to a GitHub release whenever a version tag like v1.2.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: zip -r CarrotCloak.zip CarrotCloak
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CarrotCloak.zip --title "CarrotCloak $GITHUB_REF_NAME" --generate-notes
